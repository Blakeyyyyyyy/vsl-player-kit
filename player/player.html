<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VSL player</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}html,body{margin:0;background:#000;color:#fff;font:16px Arial,sans-serif}[hidden]{display:none!important}.player{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:14px;background:#000;--accent:#32d09f;--accent-rgb:50,208,159}.player:fullscreen{width:100vw;height:100vh;border-radius:0;aspect-ratio:auto}video{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}.surface{position:absolute;inset:0;width:100%;border:0;background:transparent;color:inherit;cursor:pointer;display:grid;place-items:center;padding:0}.message{width:58%;height:70%;max-height:80%;border-radius:22px;background:rgba(var(--accent-rgb),.65);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:clamp(14px,3.5vw,34px);font-weight:700;line-height:1.35;text-align:center;animation:breathe 1.6s ease-in-out infinite}.message svg{width:15%;height:auto;margin-bottom:6%}svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;vertical-align:middle;pointer-events:none}.paused{display:grid;place-items:center;border-radius:50%;width:12%;aspect-ratio:1;background:var(--accent);box-shadow:0 0 0 14px rgba(var(--accent-rgb),.1)}.paused svg{width:45%;height:45%}.hud{position:absolute;inset:auto 2% 2%;opacity:0;transition:opacity .18s;pointer-events:none}.player.show-controls .hud,.player:has(:focus-visible) .hud{opacity:1;pointer-events:auto}.track{height:4px;background:#ffffff38;margin:0 1% 12px;pointer-events:none}.progress{height:100%;width:0;background:var(--accent);box-shadow:0 0 4px rgba(var(--accent-rgb),.3)}.buttons{display:flex;justify-content:space-between;gap:8px}.group{display:flex;background:var(--accent);border-radius:30px;padding:1px 8px;backdrop-filter:blur(8px);gap:4px}.control{color:#fff;background:transparent;border:0;border-radius:20px;width:44px;min-width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1;cursor:pointer;font:inherit}.control:hover,.control:focus-visible{background:#ffffff25;outline:2px solid #fff8}.play-control{min-width:78px}.menu{position:absolute;right:0;bottom:65px;width:min(280px,90%);max-height:calc(100% - 75px);overflow:auto;border:1px solid var(--accent);border-radius:15px;background:rgba(var(--accent-rgb),.92);backdrop-filter:blur(12px);padding:7px;color:#fff}.menu button{display:block;background:transparent;border:0;color:inherit;text-align:left;width:100%;padding:10px;font:inherit;cursor:pointer}.menu button:hover{background:#ffffff22}.menu-head{border-bottom:1px solid #fff3!important}.menu .row{display:flex;justify-content:space-between;align-items:center}.status{position:absolute;top:8px;left:8px;max-width:90%;font-size:12px;background:#0009}.status:empty{display:none}@keyframes breathe{50%{opacity:.76;transform:scale(.99)}}@media(prefers-reduced-motion:reduce){.message{animation:none}.hud{transition:none}}@media(max-width:480px){.player{border-radius:9px}.message{border-radius:14px}.control{width:44px;height:44px;min-width:44px}.play-control{min-width:48px}.group{padding:0 4px;gap:0}.control svg{width:22px;height:22px}.track{margin-bottom:8px;height:3px}.menu{bottom:58px;max-height:calc(100% - 68px);width:190px;font-size:12px}.menu button{padding:6px}.paused{box-shadow:none}}
.volume-wrap{position:relative;display:flex;align-items:center}.volume-pop{position:absolute;bottom:44px;left:0;background:rgba(var(--accent-rgb),.95);border-radius:18px;padding:10px 5px;display:none}.volume-wrap:hover .volume-pop,.volume-wrap:focus-within .volume-pop{display:block}.volume-pop input{writing-mode:vertical-lr;direction:rtl;width:20px;height:75px;accent-color:var(--accent)}</style><div id="player" class="player"><video id="video" autoplay muted playsinline preload="metadata" disablepictureinpicture controlslist="nodownload"></video><button class="surface" id="surface" aria-label="Restart video with sound"><span class="message" id="message"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4 5 9H2v6h3l6 5Z" fill="currentColor"/><path d="M15 8q5 4 0 8M18 4q9 8 0 16"/></svg>Your Video Is Playing<br>Click To Unmute</span><span class="paused" id="paused" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 4 12 8-12 8Z"/></svg></span></button><div class="hud"><div class="track"><div id="progress" class="progress"></div></div><div class="buttons"><div style="display:flex;gap:7px"><div class="group"><button id="play" class="control play-control" aria-label="Pause video">Ⅱ</button></div><div class="group"><button id="rewind" class="control" aria-label="Rewind 10 seconds"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5a9 9 0 1 1-3 7M7 2v5H2"/><text x="12" y="15.5" text-anchor="middle" fill="currentColor" stroke="none" font-size="9" font-family="Arial,sans-serif" font-weight="700">10</text></svg></button><span class="volume-wrap"><button id="mute" class="control" aria-label="Unmute video"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4 5 9H2v6h3l6 5Z"/><path d="M15 8q5 4 0 8"/></svg></button><span class="volume-pop"><input id="volume" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volume"></span></span></div></div><div class="group"><button id="settings" class="control" aria-label="Video settings" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/></svg></button><button id="fullscreen" class="control" aria-label="Toggle fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9V3h6m6 0h6v6M3 15v6h6m6 0h6v-6"/></svg></button></div></div></div><div id="menu" class="menu" hidden><div id="settings-main"><button id="quality" class="row" type="button">Quality <span>Auto ›</span></button><button id="speed-open" class="row" type="button">Speed <span id="rate-label">Normal ›</span></button></div><div id="speeds" hidden><button id="speed-back" class="menu-head">‹ Speed</button><div id="speed-options"></div></div><div id="quality-view" hidden><button id="quality-back" class="menu-head">‹ Quality</button><button type="button" id="quality-auto">Auto ✓</button><small>Original MP4; no alternate renditions.</small></div></div><span id="status" class="status" role="status"></span></div><script>
// Decorative progress only; analytics milestones still use actual media time.
function vslProgress(time,duration){
 if(!Number.isFinite(duration)||duration<=0)return 0;
 const t=Math.min(duration,Math.max(0,Number.isFinite(time)?time:0));
 if(duration<=45)return t/duration;
 if(t<=45){const x=t/45;return .85*(1-(1-x)*(1-x));}
 return .85+.15*(t-45)/(duration-45);
}
(function(){'use strict';const $=id=>document.getElementById(id),v=$('video'),root=$('player');let activated=false,last=0,autoplaySent=false,timer;const milestones=new Set();
function emit(event,value=0){const detail={event,value};if(parent!==window){try{parent.postMessage({type:'vsl-event',...detail},location.origin==='null'?'*':location.origin);}catch(e){$('status').textContent='Analytics messaging unavailable.';}}window.dispatchEvent(new CustomEvent('vsl-event',{detail}));}
function show(){root.classList.add('show-controls');clearTimeout(timer);timer=setTimeout(()=>{if(!$('menu').hidden)return;root.classList.remove('show-controls');},1800);}
function sync(){ $('paused').hidden=!activated||!v.paused;$('play').textContent=v.paused?'▷':'Ⅱ';$('play').setAttribute('aria-label',v.paused?'Play video':'Pause video');$('surface').setAttribute('aria-label',!activated?'Restart video with sound':v.paused?'Play video':'Pause video');$('mute').setAttribute('aria-label',v.muted?'Unmute video':'Mute video');$('mute').setAttribute('aria-pressed',String(v.muted));if(v.paused)show();}
function play(){try{const promise=v.play();if(promise&&promise.catch)promise.catch(()=>{$('status').textContent='Click to play.';sync();});}catch(e){$('status').textContent='Click to play.';sync();}}
function updateProgress(){$('progress').style.width=(100*vslProgress(v.currentTime,v.duration))+'%';}
function seek(t){last=Math.max(0,t);v.currentTime=last;updateProgress();}
function start(){activated=true;seek(0);v.muted=false;$('message').hidden=true;emit('unmute_click');play();sync();}
function toggle(){if(!activated){start();return;}if(v.paused){if(v.ended)seek(0);play();}else v.pause();sync();show();}
$('surface').addEventListener('click',toggle);$('play').addEventListener('click',toggle);$('rewind').addEventListener('click',()=>{seek(v.currentTime-10);show();});$('mute').addEventListener('click',()=>{if(!activated){start();return;}v.muted=!v.muted;sync();show();});
$('volume').addEventListener('input',e=>{v.volume=Number(e.target.value);if(!activated){start();}v.muted=v.volume===0;sync();show();});
v.addEventListener('playing',()=>{$('status').textContent='';if(!activated&&!autoplaySent){autoplaySent=true;emit('autoplay_start');}sync();});v.addEventListener('pause',sync);v.addEventListener('play',sync);v.addEventListener('volumechange',sync);
v.addEventListener('loadedmetadata',updateProgress);v.addEventListener('seeked',updateProgress);
v.addEventListener('seeking',()=>{if(Math.abs(v.currentTime-last)>.4)v.currentTime=last;});v.addEventListener('timeupdate',()=>{if(v.seeking)return;last=v.currentTime;const ratio=v.duration>0?Math.min(1,last/v.duration):0;updateProgress();if(activated)for(const n of [25,50,75])if(ratio>=n/100&&!milestones.has(n)){milestones.add(n);emit('watched_'+n,n);}});v.addEventListener('ended',()=>{$('progress').style.width='100%';if(activated&&!milestones.has(100)){milestones.add(100);emit('watched_100',100);}sync();});v.addEventListener('error',()=>{$('status').textContent='Video unavailable. Check the MP4 file.';});
function view(id){for(const name of ['settings-main','speeds','quality-view'])$(name).hidden=name!==id;}
$('settings').addEventListener('click',()=>{$('menu').hidden=!$('menu').hidden;$('settings').setAttribute('aria-expanded',String(!$('menu').hidden));view('settings-main');show();});$('speed-open').addEventListener('click',()=>view('speeds'));$('quality').addEventListener('click',()=>view('quality-view'));for(const id of ['speed-back','quality-back'])$(id).addEventListener('click',()=>view('settings-main'));$('quality-auto').addEventListener('click',()=>{$('menu').hidden=true;$('settings').setAttribute('aria-expanded','false');});
for(const rate of [.5,.75,1,1.25,1.5,2]){const button=document.createElement('button');button.type='button';button.dataset.rate=rate;button.textContent=(rate===1?'Normal':rate+'x')+(rate===1?' ✓':'');button.setAttribute('aria-pressed',String(rate===1));button.addEventListener('click',()=>{v.playbackRate=rate;$('rate-label').textContent=(rate===1?'Normal':rate+'x')+' ›';for(const b of $('speed-options').children){const selected=Number(b.dataset.rate)===rate;b.textContent=(Number(b.dataset.rate)===1?'Normal':b.dataset.rate+'x')+(selected?' ✓':'');b.setAttribute('aria-pressed',String(selected));}$('menu').hidden=true;$('settings').setAttribute('aria-expanded','false');show();});$('speed-options').append(button);}
$('fullscreen').addEventListener('click',()=>{try{let p;if(document.fullscreenElement)p=document.exitFullscreen();else if(root.requestFullscreen)p=root.requestFullscreen();else if(v.webkitEnterFullscreen){v.webkitEnterFullscreen();return;}else{$('status').textContent='Fullscreen unavailable in this browser.';return;}if(p&&p.catch)p.catch(()=>{$('status').textContent='Fullscreen unavailable in this context.';});}catch(e){$('status').textContent='Fullscreen unavailable in this context.';}});
root.addEventListener('pointermove',show);root.addEventListener('pointerenter',show);root.addEventListener('pointerleave',()=>{if($('menu').hidden)root.classList.remove('show-controls');});root.addEventListener('focusin',show);document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('menu').hidden=true;$('settings').setAttribute('aria-expanded','false');}});window.addEventListener('message',e=>{if(e.source===parent&&e.origin===location.origin&&e.data&&e.data.type==='vsl-analytics-ready'&&autoplaySent){try{parent.postMessage({type:'vsl-event',event:'autoplay_start',value:0},location.origin==='null'?'*':location.origin);}catch(error){$('status').textContent='Analytics messaging unavailable.';}}});try{const c=parent.VSL_CONFIG;if(c&&c.videoUrl){const u=new URL(c.videoUrl,parent.location.href);if(!['http:','https:'].includes(u.protocol))throw Error('Invalid video URL');v.src=u.href;}}catch(error){$('status').textContent='Check videoUrl config and same-origin embed.';}v.muted=true;play();
})();
</script></html>
