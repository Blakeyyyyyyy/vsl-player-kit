<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>VSL kit tracking demo</title><style>body{margin:20px;background:#0a1110;color:white;font:16px system-ui}main{max-width:900px;margin:auto}iframe{width:100%;aspect-ratio:16/9;border:0}button,a{padding:12px;display:inline-block;color:#061510;background:#32d09f;margin:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style><main><h1>VSL player kit — mock tracking</h1><p>Demo video and mock destinations. No live Pixel or Supabase requests.</p><script>window.PIXEL_CALLS=[];window.SUPABASE_CALLS=[];window.fbq=(...args)=>PIXEL_CALLS.push(args);window.addEventListener('vsl:supabase-mock',e=>SUPABASE_CALLS.push(e.detail));</script><script src="player/config.js"></script><script>VSL_CONFIG.pageOwnsLead=false; // Demo explicitly tests kit-owned Lead; production defaults to the existing confirmation-page Lead.
</script><iframe id="vsl-frame" src="player/player.html" allow="autoplay; fullscreen" allowfullscreen title="VSL video"></iframe><a href="/register/" id="cta">Demo CTA</a><button id="submit" type="button">Simulate successful form submit</button><pre id="report"></pre><script src="player/embed.js"></script><script>document.getElementById('cta').addEventListener('click',e=>e.preventDefault());document.getElementById('submit').addEventListener('click',()=>VSLKit.formSubmitted());setInterval(()=>{document.getElementById('report').textContent=JSON.stringify({supabase:SUPABASE_CALLS.map(x=>x.event),pixel:PIXEL_CALLS.map(x=>x[1])},null,2)},500);</script></main></html>
