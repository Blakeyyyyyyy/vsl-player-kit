<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private VSL analytics</title><style>body{font:16px system-ui;max-width:1100px;margin:30px auto;padding:15px;color:#17222b}input,button{padding:10px;margin:5px}table{border-collapse:collapse;width:100%;display:block;overflow:auto}td,th{padding:10px;border-bottom:1px solid #ccc;text-align:left}#metrics{padding:20px;background:#eef5f2;line-height:2}input{max-width:90%}</style><h1>VSL analytics</h1><p id="mode"></p><form id="login"><input id="email" type="email" autocomplete="username" placeholder="Admin email" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button>Sign in and load</button></form><button id="logout">Clear session</button><p role="status" id="status"></p><div id="metrics"></div><h2>By UTC day, page and UTM</h2><table><thead><tr><th>Day</th><th>Page</th><th>Source / medium / campaign / term / content</th><th>Views</th><th>Starts</th><th>25/50/75/100%</th><th>CTA clicks</th><th>Form sessions</th></tr></thead><tbody id="rows"></tbody></table><script src="player/config.js"></script><script src="dashboard.js"></script></html>
